<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | Oyuki</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=40"></head><body><div id="oy-navbar"></div><section class="cart-page"><div class="container"><div class="cart-heading"><span>SHOPPING CART</span><h1>Your cart</h1></div><div class="cart-layout"><div id="items" class="cart-items"><div class="panel">Loading cart…</div></div><aside id="summary" class="cart-summary"></aside></div></div></section><div id="oy-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/assets/js/app.js?v=40"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{if(!Oyuki.Auth.require('CUSTOMER'))return;await render()});async function render(){items.innerHTML='<div class="panel">Loading cart…</div>';try{const c=await Oyuki.Cart.get(),list=c.items||[];if(!list.length){items.innerHTML='<div class="empty-cart"><i class="bi bi-cart-x"></i><h2>Your cart is empty</h2><p>Add fresh produce or meals to continue.</p><a href="shop.html" class="btn btn-brand">Start shopping</a></div>';summary.innerHTML='';return}items.innerHTML=list.map(i=>`<article class="cart-product"><img src="${Oyuki.imageUrl(i.primaryImageUrl)}" alt="${Oyuki.escapeHtml(i.productName)}"><div class="cart-product-info"><h3>${Oyuki.escapeHtml(i.productName)}</h3><p>${i.measurementValue} ${String(i.measurementUnit).replaceAll('_',' ')}</p><strong>${Oyuki.fmt(i.unitPrice)}</strong><button onclick="removeItem(${i.cartItemId})"><i class="bi bi-trash"></i> Remove</button></div><div class="qty-control"><button onclick="changeQty(${i.cartItemId},${Math.max(1,i.quantity-1)})">−</button><span>${i.quantity}</span><button onclick="changeQty(${i.cartItemId},${Math.min(i.availableStock,i.quantity+1)})">+</button></div><b class="cart-line-total">${Oyuki.fmt(i.lineTotal)}</b></article>`).join('');summary.innerHTML=`<h2>Order summary</h2><div><span>Items (${c.totalItems})</span><strong>${Oyuki.fmt(c.subtotal)}</strong></div><div><span>Delivery</span><small>Calculated at checkout</small></div><hr><div class="cart-total"><span>Total</span><strong>${Oyuki.fmt(c.subtotal)}</strong></div><a href="checkout.html" class="btn btn-brand w-100">Proceed to checkout</a><a href="shop.html" class="continue-link">Continue shopping</a>`}catch(e){items.innerHTML=`<div class="alert alert-danger">${Oyuki.escapeHtml(e.message)}</div>`}}async function changeQty(id,q){try{await Oyuki.Cart.update(id,q);render()}catch(e){Oyuki.Toast.show(e.message,'error')}}async function removeItem(id){try{await Oyuki.Cart.remove(id);render()}catch(e){Oyuki.Toast.show(e.message,'error')}}
</script></body></html>
