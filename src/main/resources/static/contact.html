<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oyuki Support</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=40"></head><body><div id="oy-navbar"></div><section class="support-page"><div class="container"><div class="support-layout"><aside class="support-info"><span class="eyebrow">Customer support</span><h1>How can Oyuki help?</h1><p>Chat with us about orders, payments, provider applications or delivery issues.</p><a href="https://wa.me/2347013403517" target="_blank"><i class="bi bi-whatsapp"></i> WhatsApp support</a><a href="mailto:oyukiagrofarm@gmail.com"><i class="bi bi-envelope"></i> oyukiagrofarm@gmail.com</a><a href="tel:+2347013403517"><i class="bi bi-telephone"></i> +234 701 340 3517</a></aside><div class="support-chat"><header><div class="support-bot"><i class="bi bi-robot"></i></div><div><strong>Oyuki Support</strong><small><span></span> Online</small></div></header><div id="chatMessages" class="support-messages"><div class="chat-row bot"><div class="bubble">Hello 👋 Welcome to Oyuki Support. How can we help you today?</div></div><div class="quick-replies"><button data-message="I need help tracking my order">Track my order</button><button data-message="I have a payment issue">Payment issue</button><button data-message="I need help with my provider application">Provider application</button><button data-message="I have a delivery complaint">Delivery complaint</button></div></div><form id="supportForm" class="support-compose"><input id="supportInput" placeholder="Type your message..." maxlength="1000" required><button aria-label="Send"><i class="bi bi-send-fill"></i></button></form></div></div></div></section><div id="oy-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/assets/js/app.js?v=40"></script><script>
const box=document.getElementById('chatMessages'),input=document.getElementById('supportInput');function add(text,type){box.insertAdjacentHTML('beforeend',`<div class="chat-row ${type}"><div class="bubble">${Oyuki.escapeHtml(text)}</div></div>`);box.scrollTop=box.scrollHeight}async function send(text){add(text,'user');input.value='';setTimeout(()=>add('Thank you. Your message has been received. Include your order number when the issue concerns an order. Our support team will respond shortly.','bot'),500);try{await Oyuki.Api.post('/contact',{fullName:Oyuki.Auth.current()?.fullName||'Website visitor',phoneNumber:Oyuki.Auth.current()?.phoneNumber||null,email:Oyuki.Auth.current()?.email||'visitor@oyukimarketplace.com',subject:'Website support chat',message:text},false)}catch(_){}}
supportForm.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(t)send(t)});document.querySelectorAll('[data-message]').forEach(b=>b.onclick=()=>send(b.dataset.message));
</script></body></html>
