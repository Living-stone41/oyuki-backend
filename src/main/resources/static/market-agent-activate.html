<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Market Agent Account | Oyuki</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=market-agent3"></head>
<body class="oy-auth-page"><section class="oy-auth-visual"><a class="oy-auth-brand" href="home.html">Oyuki</a><div class="oy-auth-copy"><h2>Activate your market-agent account.</h2><p>Verify your email and create your secure password.</p></div><div class="oy-auth-points"><span>Email verification is required</span><span>OTP is sent to your email only</span></div></section><main class="oy-auth-main"><div class="oy-auth-box"><div class="oy-wordmark">Oyuki</div><h1>Market Agent verification</h1><p class="oy-auth-sub">Enter the 6-digit OTP sent to the email address provided by the admin.</p><div id="activationError" class="oy-inline-error"></div><form id="market-agentActivationForm"><div class="oy-field"><label for="email">Email</label><div class="oy-input-wrap"><i class="bi bi-envelope"></i><input class="oy-input" id="email" name="email" type="email" required></div></div><div class="oy-field"><label for="emailOtp">Email OTP</label><div class="oy-input-wrap"><i class="bi bi-envelope-check"></i><input class="oy-input" id="emailOtp" name="emailOtp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"></div></div><div class="oy-field"><label for="password">Create password</label><div class="oy-input-wrap"><i class="bi bi-lock"></i><input class="oy-input" id="password" name="password" type="password" minlength="8" required></div></div><div class="oy-field"><label for="confirmPassword">Confirm password</label><div class="oy-input-wrap"><i class="bi bi-lock-fill"></i><input class="oy-input" id="confirmPassword" name="confirmPassword" type="password" minlength="8" required></div></div><button class="oy-submit" id="activateButton" type="submit">Verify and activate</button></form><p class="oy-auth-bottom">Already activated? <a href="login.html">Log in</a></p></div></main><script src="assets/js/app.js?v=market-agent3"></script><script src="assets/js/market-agent-activate.js?v=market-agent3"></script></body></html>
