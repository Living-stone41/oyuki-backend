<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activate Marketer Account | Oyuki</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=marketer2">
</head>
<body class="oy-auth-page">
  <section class="oy-auth-visual">
    <a class="oy-auth-brand" href="home.html">Oyuki</a>
    <div class="oy-auth-copy"><h2>Activate your marketer account.</h2><p>Enter the OTP sent by Oyuki and create your secure password.</p></div>
    <div class="oy-auth-points"><span>₦2,000 per qualified Seller/Kitchen</span><span>Withdraw after 20 qualified sign-ups</span></div>
  </section>
  <main class="oy-auth-main">
    <div class="oy-auth-box">
      <div class="oy-wordmark">Oyuki</div>
      <h1>Marketer verification</h1>
      <p class="oy-auth-sub">Use the email or phone number supplied by the administrator.</p>
      <div id="activationError" class="oy-inline-error"></div>
      <form id="marketerActivationForm">
        <div class="oy-field"><label for="contact">Email or phone</label><div class="oy-input-wrap"><i class="bi bi-person"></i><input class="oy-input" id="contact" name="contact" required></div></div>
        <div class="oy-field"><label for="token">6-digit OTP</label><div class="oy-input-wrap"><i class="bi bi-shield-check"></i><input class="oy-input" id="token" name="token" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></div></div>
        <div class="oy-field"><label for="password">Create password</label><div class="oy-input-wrap"><i class="bi bi-lock"></i><input class="oy-input" id="password" name="password" type="password" minlength="8" required></div></div>
        <div class="oy-field"><label for="confirmPassword">Confirm password</label><div class="oy-input-wrap"><i class="bi bi-lock-fill"></i><input class="oy-input" id="confirmPassword" name="confirmPassword" type="password" minlength="8" required></div></div>
        <button class="oy-submit" id="activateButton" type="submit">Verify and activate</button>
      </form>
      <p class="oy-auth-bottom">Already activated? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <script src="assets/js/app.js?v=marketer2"></script>
  <script src="assets/js/marketer-activate.js?v=marketer2"></script>
</body>
</html>
