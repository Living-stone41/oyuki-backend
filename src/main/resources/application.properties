spring.application.name=oyuki-backend
server.port=${PORT:8080}
server.address=0.0.0.0

# Database: Railway variables in production, local MySQL defaults for development
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/oyuki_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS origins, comma-separated
app.cors.allowed-origins=http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,https://oyukimarketplace.com,https://www.oyukimarketplace.com,https://admin.oyukimarketplace.com,https://*.up.railway.app
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never

# Persistent uploads (mount Railway volume at /app/uploads)
app.upload.root=${FILE_UPLOAD_ROOT:uploads}
app.upload.payment-receipts=${PAYMENT_RECEIPT_UPLOAD_DIR:${FILE_UPLOAD_ROOT:uploads}/payment-receipts}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.admin.notification-email=${OYUKI_ADMIN_EMAIL:}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.full-name=${ADMIN_FULL_NAME:Oyuki Administrator}

