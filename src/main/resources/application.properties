resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:Oyuki <onboarding@resend.dev>}
# Twilio Verify OTP
app.sms.enabled=${OYUKI_SMS_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}

# Paystack payments
# Add the live or test keys as environment variables. Never commit real keys.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.currency=${PAYSTACK_CURRENCY:NGN}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:}

# Contact support
app.contact.support-email=${OYUKI_SUPPORT_EMAIL:${OYUKI_MAIL_USERNAME:}}
# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Remove connections after 4 minutes
spring.datasource.hikari.max-lifetime=240000

# Check idle connections every 2 minutes
spring.datasource.hikari.keepalive-time=120000

# Remove unused idle connections after 3 minutes
spring.datasource.hikari.idle-timeout=180000

# Wait up to 30 seconds for a database connection
spring.datasource.hikari.connection-timeout=30000

# Validate connections
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# Referral rewards (amounts are in NGN)
app.referral.referrer-reward=${REFERRAL_REFERRER_REWARD:500}
app.referral.referred-user-reward=${REFERRAL_REFERRED_USER_REWARD:0}
